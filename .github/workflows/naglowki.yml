name: Pobierz naglowki

on:
  schedule:
    - cron: "11,31,51 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pobierz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python naglowki.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add naglowki.json
          git diff --cached --quiet || (git commit -m "Naglowki" && git pull --rebase && git push)
