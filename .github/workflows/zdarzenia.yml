name: Pobierz zdarzenia

on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pobierz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python zdarzenia.py
      - run: python wiadomosci.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add zdarzenia.geojson zdarzenia_surowe.json wiadomosci.json
          git diff --cached --quiet || (git commit -m "Zdarzenia" && git pull --rebase && git push)
