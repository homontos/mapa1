name: Historia ruchu

on:
  schedule:
    - cron: "3,33 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historia-ruchu
  cancel-in-progress: false

jobs:
  zapisz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Petla zapisow co 5 minut (ok. 25 minut)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python petla_historii.py
