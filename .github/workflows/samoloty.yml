name: Pobierz samoloty

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dane-samoloty
  cancel-in-progress: false

jobs:
  pobierz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pobierz_samoloty.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add samoloty.json
          git diff --cached --quiet || (git commit -m "Samoloty" && git pull --rebase && git push)
