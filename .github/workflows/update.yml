name: Update OSINT Live Feed

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install beautifulsoup4 google-genai pydantic
      - name: Run OSINT scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_feed.py
      - name: Commit and push feed.json
        run: |
          git config --global user.name "OSINT Bot"
          git config --global user.email "bot@://github.com"
          git add feed.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update live feed" && git push)
