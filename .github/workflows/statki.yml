name: Pobierz statki

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pobierz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets
      - run: python pobierz_statki.py
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add statki.geojson
          git diff --cached --quiet || (git commit -m "Aktualizacja statkow" && git push)
