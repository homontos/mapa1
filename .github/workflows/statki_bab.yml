name: Pobierz statki Bab

on:
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dane-statki-bab
  cancel-in-progress: false

jobs:
  pobierz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pobierz_bab.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add statki_bab.geojson
          git diff --cached --quiet || (git commit -m "Statki Bab" && git pull --rebase && git push)
