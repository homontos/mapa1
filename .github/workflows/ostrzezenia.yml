name: Pobierz ostrzezenia

on:
  schedule:
    - cron: "3,23,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pobierz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ostrzezenia.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add ostrzezenia.json
          if ! git diff --cached --quiet; then
            git commit -m "Ostrzezenia"
            for i in 1 2 3 4; do
              git pull --rebase && git push && break
              sleep $((i * 5))
            done
          fi
