name: Zrob wybrzeze Bab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wybrzeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely
      - run: python zrob_wybrzeze.py
        env:
          BBOX: "40.0,9.5,47.5,16.5"
          PLIK_WYJSCIOWY: wybrzeze_bab.geojson
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add wybrzeze_bab.geojson
          git diff --cached --quiet || (git commit -m "Wybrzeze Bab" && git push)
