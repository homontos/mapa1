name: Zrob wybrzeze Ormuz

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wybrzeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely
      - run: python zrob_wybrzeze.py
        env:
          BBOX: "52.5,23.5,60.0,28.5"
          PLIK_WYJSCIOWY: wybrzeze_ormuz.geojson
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add wybrzeze_ormuz.geojson
          git diff --cached --quiet || (git commit -m "Wybrzeze Ormuz" && git push)
