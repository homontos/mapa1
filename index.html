<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruch statków</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    #map { position: fixed; inset: 0; }
    .popup-tytul { font-weight: bold; margin-bottom: 4px; }
    .popup-wiersz { font-size: 13px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    const map = new maplibregl.Map({
      container: "map",
      style: {
        version: 8,
        sources: {
          kraje: {
            type: "vector",
            url: "https://demotiles.maplibre.org/tiles/tiles.json"
          }
        },
        layers: [
          { id: "tlo", type: "background",
            paint: { "background-color": "#c8c8c8" } },
          { id: "ladowe", type: "fill", source: "kraje",
            "source-layer": "countries",
            paint: { "fill-color": "#e4e4e4" } },
          { id: "granice", type: "line", source: "kraje",
            "source-layer": "countries",
            paint: { "line-color": "#a0a0a0", "line-width": 0.8 } }
        ]
      },
      center: [18.9, 54.5],
      zoom: 7
    });
    map.addControl(new maplibregl.NavigationControl());

    const adresDanych = () => "statki.geojson?t=" + Date.now();

    function wiersz(etykieta, wartosc) {
      if (wartosc === undefined || wartosc === null || wartosc === "") return null;
      const div = document.createElement("div");
      div.className = "popup-wiersz";
      div.textContent = etykieta + ": " + wartosc;
      return div;
    }

    map.on("load", () => {
      map.addSource("statki", { type: "geojson", data: adresDanych() });

      map.addLayer({
        id: "statki",
        type: "circle",
        source: "statki",
        paint: {
          "circle-radius": 6,
          "circle-color": "#1c7ed6",
          "circle-stroke-width": 1.5,
          "circle-stroke-color": "#ffffff"
        }
      });

      map.on("click", "statki", (e) => {
        const p = e.features[0].properties;
        const box = document.createElement("div");

        const tytul = document.createElement("div");
        tytul.className = "popup-tytul";
        tytul.textContent = p.nazwa || "Statek bez nazwy";
        box.appendChild(tytul);

        const czas = p.aktualizacja
          ? new Date(p.aktualizacja).toLocaleString("pl-PL") : null;
        [
          wiersz("MMSI", p.mmsi),
          wiersz("Typ", p.typ),
          wiersz("Prędkość", p.predkosc != null ? p.predkosc + " węzłów" : null),
          wiersz("Kurs", p.kurs != null ? p.kurs + "°" : null),
          wiersz("Cel rejsu", p.cel),
          wiersz("Ostatni sygnał", czas)
        ].forEach((w) => { if (w) box.appendChild(w); });

        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setDOMContent(box)
          .addTo(map);
      });

      map.on("mouseenter", "statki", () => map.getCanvas().style.cursor = "pointer");
      map.on("mouseleave", "statki", () => map.getCanvas().style.cursor = "");

      setInterval(() => {
        map.getSource("statki").setData(adresDanych());
      }, 120000);
    });
  </script>
</body>
</html>
